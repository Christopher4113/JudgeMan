[project]
name = "judgeman"
version = "0.1.0"
description = "Step-level evals for AI agent runs, with a measured trust number for the judge."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "rich>=13"]

[project.optional-dependencies]
judge = ["openai>=1.40"]

[project.scripts]
judgeman = "judgeman.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
